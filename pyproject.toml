[project]
name = "slm"
version = "0.1.0"
description = "Text-to-SQL Small Language Model Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets==3.4.1",
    "dotenv>=0.9.9",
    "huggingface-hub==0.34.0",
    "openai>=2.21.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.3",
    "reasoning-gym>=0.1.24",
    "rich>=14.3.2",
    "sqlglot>=28.10.1",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "transformers==4.57.6",
    "trl==0.24.0",
    "unsloth>=2026.1.4",
    "poethepoet>=0.41.0",
    "python-dotenv>=1.0.1",
    "wandb>=0.25.0",
    "mlflow[databricks]>=3.9.0",
    "tiktoken>=0.12.0",
    "dataset>=1.6.2",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pymysql>=1.1.2",
    "sqlalchemy>=1.4.54",
    "polars>=1.38.1",
]

[tool.poe.tasks]
data = "python main.py data all"
train = "python main.py train sft"
eval = "python main.py eval"
infer = "python main.py infer"
infer-trace = "python main.py infer --trace"
pipeline = "python main.py pipeline full"
mlflow-ui = "mlflow ui --port 5000"
