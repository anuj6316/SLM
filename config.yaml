# ==============================================================================
# SLM TEXT-TO-SQL UNIFIED CONFIGURATION
# ==============================================================================
# This file controls the entire pipeline from data to inference.
# Settings can be overridden via environment variables with SLM__ prefix.
# Example: SLM__MODEL__NAME="Qwen/Qwen2.5-7B" python main.py train sft

# ------------------------------------------------------------------------------
# PROJECT METADATA
# ------------------------------------------------------------------------------
project:
  name: "SLM Text-to-SQL"
  version: "1.0.0"
  description: "Small Language Model for Text-to-SQL"

# ------------------------------------------------------------------------------
# MLFLOW / TRACING
# ------------------------------------------------------------------------------
mlflow:
  enabled: true
  tracking_uri: "databricks"
  experiment_name: "/Shared/text2sql"
  registry_uri: "databricks-uc"

# ------------------------------------------------------------------------------
# DATA PIPELINE
# ------------------------------------------------------------------------------
data:
  datasets:
    - name: "spider"
      source: "xlangai/spider"
      split: "train"
    - name: "bird"
      source: "xu3kev/BIRD-SQL-data-train"
      split: "train"
    - name: "gretel"
      source: "gretelai/synthetic_text_to_sql"
      split: "train"
  
  output_dir: "data"
  raw_dir: "data/raw"
  train_file: "data/train_split.jsonl"
  val_file: "data/val_split.jsonl"
  tables_file: "data/raw/spider_tables.json"
  train_split: 0.95
  seed: 42

# ------------------------------------------------------------------------------
# MODEL
# ------------------------------------------------------------------------------
model:
  name: "/home/mindmap/Desktop/SLM/Qwen/Qwen2.5-Coder-3B-Instruct"
  max_seq_length: 2048
  load_in_4bit: false
  dtype: null

# ------------------------------------------------------------------------------
# LORA / PEFT
# ------------------------------------------------------------------------------
lora:
  r: 64
  lora_alpha: 64
  lora_dropout: 0.0
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# ------------------------------------------------------------------------------
# TRAINING
# ------------------------------------------------------------------------------
training:
  output_dir: "outputs/qwen-coder-3b-text2sql"
  epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_steps: 50
  weight_decay: 0.01
  seed: 42
  logging_steps: 10
  save_steps: 500
  eval_strategy: "steps"
  eval_steps: 500
  save_total_limit: 2
  optim: "adamw_8bit"
  report_to: "mlflow"

# ------------------------------------------------------------------------------
# EVALUATION
# ------------------------------------------------------------------------------
evaluation:
  benchmark: "spider"
  output_dir: "eval_results"
  batch_size: 1

# ------------------------------------------------------------------------------
# INFERENCE
# ------------------------------------------------------------------------------
inference:
  data_path: "data/val_split.jsonl"
  max_new_tokens: 128
  output_path: null
  num_samples: null
  do_sample: false
  temperature: 0.0

# ------------------------------------------------------------------------------
# FORMATTING
# ------------------------------------------------------------------------------
formatting:
  system_prompt: "You are an expert Text-to-SQL assistant. Convert the natural language question into a valid SQL query based on the schema."
  chat_template: "chatml"
